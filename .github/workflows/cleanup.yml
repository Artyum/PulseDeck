name: Cleanup

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Keep last 5 image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: pulsedeck
          package-type: container
          min-versions-to-keep: 5

  clean-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete runs older than 30 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --repo "${{ github.repository }}" --limit 100 \
            --created "<$(date -d '30 days ago' +%Y-%m-%d)" --json databaseId -q '.[].databaseId' \
            | xargs -r -I {} gh run delete {} --repo "${{ github.repository }}"

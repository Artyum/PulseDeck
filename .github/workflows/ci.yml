name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: ruff format
        run: ruff format . --check --color=never

      - name: ruff check
        run: ruff check . --output-format=concise --color=never

      - name: basedpyright
        run: basedpyright --pythonpath "$(command -v python)" app alembic scripts tests

      - name: djlint
        run: djlint frontend/templates/ --lint

      - name: prettier
        run: npm run format:check

      - name: stylelint
        run: npm run lint:css

      - name: jscpd
        run: npm run lint:dup

      - name: pytest
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing:skip-covered

  build:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main-latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup:
    name: Cleanup
    needs: [test, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KEEP: "3"
    steps:
      - name: Keep ${{ env.KEEP }} newest GHCR images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          package="$(echo "$PACKAGE" | tr '[:upper:]' '[:lower:]')"
          if [ "$OWNER_TYPE" = "Organization" ]; then
            api="orgs/${OWNER}"
          else
            api="users/${OWNER}"
          fi

          ids="$(gh api --paginate "/${api}/packages/container/${package}/versions" \
            --jq "sort_by(.created_at) | reverse | .[${KEEP}:] | .[].id" || true)"

          if [ -z "${ids}" ]; then
            echo "No GHCR versions to delete (keeping up to ${KEEP})."
            exit 0
          fi

          deleted=0
          while IFS= read -r id; do
            [ -z "${id}" ] && continue
            echo "Deleting GHCR version ${id}"
            gh api -X DELETE "/${api}/packages/container/${package}/versions/${id}"
            deleted=$((deleted + 1))
          done <<< "${ids}"
          echo "Deleted ${deleted} GHCR version(s)."

      - name: Keep ${{ env.KEEP }} newest runs per workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          workflows="$(gh api --paginate "/repos/${REPO}/actions/workflows?per_page=100" \
            --jq '.workflows[] | [.id, .path] | @tsv')"
          if [ -z "${workflows}" ]; then
            echo "No workflows found."
            exit 0
          fi

          deleted=0
          while IFS=$'\t' read -r workflow_id path; do
            [ -z "${workflow_id}" ] && continue
            name="$(basename "${path}")"
            echo "Cleaning runs for ${name}"
            ids="$(gh api --paginate \
              "/repos/${REPO}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq ".workflow_runs | .[${KEEP}:] | .[].id" || true)"
            while IFS= read -r id; do
              [ -z "${id}" ] && continue
              if [ "${id}" = "${CURRENT_RUN}" ]; then
                continue
              fi
              echo "Deleting run ${id} (${name})"
              gh api -X DELETE "/repos/${REPO}/actions/runs/${id}"
              deleted=$((deleted + 1))
            done <<< "${ids}"
          done <<< "${workflows}"
          echo "Deleted ${deleted} workflow run(s)."

      - name: Keep ${{ env.KEEP }} newest Actions caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "/repos/${REPO}/actions/caches" --jq '.actions_caches[]' \
            | jq -s "sort_by(.created_at) | reverse | .[${KEEP}:] | .[].id" || true)"

          if [ -z "${ids}" ]; then
            echo "No Actions caches to delete (keeping up to ${KEEP})."
            exit 0
          fi

          deleted=0
          while IFS= read -r id; do
            [ -z "${id}" ] && continue
            echo "Deleting cache ${id}"
            gh cache delete "${id}" --repo "${REPO}"
            deleted=$((deleted + 1))
          done <<< "${ids}"
          echo "Deleted ${deleted} cache(s)."

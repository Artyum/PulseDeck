name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: pip install -U -r requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: ruff format
        run: ruff format . --check --color=never

      - name: ruff check
        run: ruff check . --output-format=concise --color=never

      - name: basedpyright
        run: basedpyright --pythonpath "$(command -v python)" app alembic scripts tests

      - name: djlint
        run: djlint frontend/templates/ --lint

      - name: prettier
        run: npm run format:check

      - name: stylelint
        run: npm run lint:css

      - name: jscpd
        run: npm run lint:dup

      - name: pytest
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing:skip-covered

  build:
    name: Build, smoke test & publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main-latest,enable={{is_default_branch}}

      - name: Build image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            pulsedeck:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=min,scope=main' || '' }}

      - name: Start smoke-test database
        run: |
          docker network create pulsedeck-ci
          docker run -d --name pulsedeck-ci-db --network pulsedeck-ci \
            -e POSTGRES_DB=pulsedeck \
            -e POSTGRES_USER=pulsedeck \
            -e POSTGRES_PASSWORD=pulsedeck \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec pulsedeck-ci-db pg_isready -U pulsedeck -d pulsedeck >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs pulsedeck-ci-db
          exit 1

      - name: Run smoke-test migration
        run: |
          docker run --rm --network pulsedeck-ci \
            --entrypoint /app/deploy/entrypoint_migrate.sh \
            -e DATABASE_URL=postgresql+psycopg://pulsedeck:pulsedeck@pulsedeck-ci-db:5432/pulsedeck \
            -e STORAGE_SECRET=ci-only-secret \
            "$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"

      - name: Smoke test image
        run: |
          set -euo pipefail
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n 1)"
          docker run -d --name pulsedeck-ci \
            --network pulsedeck-ci \
            -e DATABASE_URL=postgresql+psycopg://pulsedeck:pulsedeck@pulsedeck-ci-db:5432/pulsedeck \
            -e STORAGE_SECRET=ci-only-secret \
            -e ENVIRONMENT=staging \
            -e PUBLIC_BASE=https://example.com \
            -e API_BASE=http://127.0.0.1:8000 \
            -e UVICORN_WORKERS=1 \
            "$image"
          for i in $(seq 1 45); do
            if docker run --rm --network pulsedeck-ci curlimages/curl:8.10.1 \
              -fsS http://pulsedeck-ci:8000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs pulsedeck-ci
          exit 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image tags
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Cleanup smoke resources
        if: always()
        run: |
          docker rm -f pulsedeck-ci pulsedeck-ci-db 2>/dev/null || true
          docker network rm pulsedeck-ci 2>/dev/null || true

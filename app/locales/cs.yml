email:
  mfa:
    subject: Přihlašovací kód
    body: 'Váš ověřovací kód pro přihlášení:'
    ttl: Kód je platný {minutes} min.
  confirm:
    subject: Potvrďte svůj nový e-mail
    body: Obdrželi jsme žádost o změnu vaší e-mailové adresy v {app}. Potvrďte novou adresu pomocí tlačítka níže. Odkaz je platný {minutes} min. Pokud jste to nebyli vy, můžete tuto zprávu ignorovat.
    cta: Potvrďte email
  activate:
    subject: Aktivujte svůj účet
    body: Byl pro vás vytvořen účet v {app}. Nastavte heslo pro jeho aktivaci a přihlaste se. Odkaz je platný po dobu {days} dnů.
    cta: Nastavte heslo
  reset:
    subject: Obnovení hesla
    body: Obdrželi jsme žádost o resetování vašeho hesla pro {app}. Pomocí tlačítka níže nastavte nové heslo. Odkaz je platný {days} dnů. Pokud jste to nebyli vy, můžete tuto zprávu ignorovat.
    cta: Nastavte nové heslo
  smtp_test:
    subject: Testovací email
    body: Toto je testovací zpráva od {app}. Pokud si to můžete přečíst v rozvržení značky, SMTP funguje.
  new_ticket:
    subject: Nový lístek
    body: 'Byl vytvořen nový tiket: {ticket}. Otevřete jej v {app}, přečtěte si podrobnosti a proveďte akci.'
    cta: Otevřít v {app}
  new_comment:
    subject: Nová zpráva na tiketu
    body: V lístku {ticket} se objevila nová zpráva. Přejděte na lístek, zobrazte obsah a odpovězte.
    cta: Otevřít v {app}

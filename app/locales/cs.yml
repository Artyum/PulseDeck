    label: Ranní mlha
    description: Perleťově modrá s jemným leskem.
  sandy-dawn:
    label: Sandy Shore
    description: Teplý písek a medová ambra v jemném mytí.
  green-meadow:
    label: Zelená louka
    description: Šalvěj a mech v tiché, intimní záři.
  graphite-day:
    label: Den grafitu
    description: Chladný grafit v tichém mytí oceli.
  berry-dawn:
    label: Heather Bloom
    description: Měkký vřes a bobule ve světlém, jemném praní.
  rose-dawn:
    label: Blush Glow
    description: Teplá růže a pudrová tvářenka v jasném a jemném mytí.
  deep-ocean:
    label: Hluboký oceán
    description: Safírová hloubka s jemnou propastnou září.
  amber-night:
    label: Amber Ember
    description: Espresso s teplým šampaňským.
  northern-spruce:
    label: Severní smrk
    description: Temný les s krystalickou mátovou září.
  charcoal-dusk:
    label: Uhlový soumrak
    description: Dřevěné uhlí s chladným ocelovým stříbrem v tichém soumraku.
  midnight-berry:
    label: Sametová bobule
    description: Zralé bobule v teplém fialovém polosvětlu.
  rose-night:
    label: Karmínový závoj
    description: Hluboká růže v teplém, sametovém polosvětlu.
  density:
    tight:
      label: Těsné
      description: Menší prostor, více obsahu na obrazovce.
    balanced:
      label: Vyvážený
      description: Výchozí rozestup PulseDeck.
    airy:
      label: Vzdušný
      description: Více prostoru pro dýchání mezi prvky.
  font_size:
    compact:
      label: Kompaktní
      description: Více textu na obrazovce.
    natural:
      label: Přírodní
      description: Výchozí velikost PulseDeck.
    large:
      label: Velký
      description: Pohodlnější čtení.

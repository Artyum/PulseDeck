    subject: Aktualizace lístku
    body: Stav, typ nebo priorita lístku {ticket} byly změněny.
    new_value: 'Nová hodnota: {value}'
    cta: Otevřít v {app}
  assignment:
    subject: Přiřazení lístku
    body: Byl vám přidělen lístek {ticket}. Chcete-li si prohlédnout podrobnosti, otevřete jej v {app}.
    cta: Otevřít v {app}
  common:
    greeting: Ahoj {name},
    link_hint: 'Pokud tlačítko nefunguje, zkopírujte a vložte tento odkaz do svého prohlížeče:'

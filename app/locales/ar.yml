      body: ملخص قصير اختياري يظهر في قائمة المشروع.
    admin-project-members:
      body: أضف أشخاصًا إلى المشروع حتى يتمكنوا من رؤية تذاكره والعمل عليها.
    compose-attach:
      body: أضف الملفات عن طريق اختيارها من القرص، أو سحبها هنا، أو لصقها من الحافظة (Ctrl+V).
    compose-quote:
      body: حدد النص في الرسالة، ثم انقر فوق "اقتباس".
    compose-dictate:
      body: انقر على الميكروفون لإملاء ردك. قد تمنع بعض المتصفحات أو الأجهزة الوصول إلى الميكروفون.
    compose-internal:
      body: تكون الملاحظات الداخلية مرئية للموظفين فقط، ولن يراها العملاء.
email:
  mfa:
    subject: رمز تسجيل الدخول
    body: 'رمز التحقق لتسجيل الدخول الخاص بك:'
    ttl: الكود صالح لمدة {minutes} دقيقة.
  confirm:
    subject: قم بتأكيد بريدك الإلكتروني الجديد
    body: لقد تلقينا طلبًا لتغيير عنوان بريدك الإلكتروني في {app}. قم بتأكيد العنوان الجديد باستخدام الزر أدناه. الرابط صالح لمدة {minutes} دقيقة. إذا لم تكن أنت، فيمكنك تجاهل هذه الرسالة.
    cta: تأكيد البريد الإلكتروني
  activate:
    subject: تفعيل حسابك
    body: تم إنشاء حساب لك في {app}. قم بتعيين كلمة مرور لتفعيلها وتسجيل الدخول. الرابط صالح لمدة {days} أيام.
    cta: تعيين كلمة المرور
  reset:
    subject: إعادة تعيين كلمة المرور
    body: لقد تلقينا طلبًا لإعادة تعيين كلمة المرور الخاصة بك لـ {app}. قم بتعيين كلمة مرور جديدة باستخدام الزر أدناه. الرابط صالح لمدة {days} أيام. إذا لم تكن أنت، فيمكنك تجاهل هذه الرسالة.
    cta: تعيين كلمة مرور جديدة
  smtp_test:
    subject: اختبار البريد الإلكتروني
    body: هذه رسالة اختبارية من {app}. إذا كان بإمكانك قراءة هذا في التخطيط ذي العلامة التجارية، فهذا يعني أن SMTP يعمل.
  new_ticket:
    subject: تذكرة جديدة
    body: 'تم إنشاء تذكرة جديدة: {ticket}. افتحه في {app} لمراجعة التفاصيل واتخاذ الإجراء.'
    cta: مفتوح في {app}
  new_comment:
    subject: رسالة جديدة على التذكرة
    body: ظهرت رسالة جديدة في التذكرة {ticket}. انتقل إلى التذكرة لرؤية المحتوى والرد.
    cta: مفتوح في {app}
  ticket_update:
    subject: تحديث التذكرة
    body: تم تغيير حالة أو نوع أو أولوية التذكرة {ticket}.
    new_value: 'القيمة الجديدة: {value}'
    cta: مفتوح في {app}
  assignment:
    subject: مهمة التذاكر
    body: لقد تم تخصيص تذكرة لك {ticket}. افتحه في {app} لمراجعة التفاصيل.
    cta: مفتوح في {app}
  common:
    greeting: مرحبًا {name}،
    link_hint: 'إذا لم يعمل الزر، انسخ هذا الرابط والصقه في متصفحك:'
    unsubscribe: انقر هنا إذا لم تعد ترغب في تلقي هذه الإشعارات
    unwatch: انقر هنا إذا كنت لم تعد ترغب في مشاهدة هذه التذكرة

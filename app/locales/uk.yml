    body: Ми отримали запит на зміну вашої електронної адреси в {app}. Підтвердьте нову адресу за допомогою кнопки нижче. Посилання дійсне {minutes} хв. Якщо це були не ви, ви можете проігнорувати це повідомлення.
    cta: Підтвердити електронну адресу
  activate:
    subject: Активуйте свій акаунт
    body: Для вас створено обліковий запис у {app}. Встановіть пароль, щоб активувати його та увійти. Посилання дійсне протягом {days} днів.
    cta: Встановити пароль
  reset:
    subject: Скидання пароля
    body: Ми отримали запит на скидання вашого пароля для {app}. Встановіть новий пароль за допомогою кнопки нижче. Посилання дійсне {days} днів. Якщо це були не ви, ви можете проігнорувати це повідомлення.
    cta: Встановити новий пароль
  smtp_test:
    subject: Тестовий електронний лист
    body: Це тестове повідомлення від {app}. Якщо ви можете прочитати це на фірмовому макеті, SMTP працює.
  new_ticket:
    subject: Новий квиток
    body: 'Було створено новий квиток: {ticket}. Відкрийте його в {app}, щоб переглянути деталі та вжити заходів.'
    cta: Відкрити в {app}
  new_comment:
    subject: Нове повідомлення на квитку
    body: У білеті {ticket} з’явилося нове повідомлення. Перейдіть до квитка, щоб переглянути вміст і відповісти.
    cta: Відкрити в {app}
  ticket_update:
    subject: Оновлення квитка
    body: Статус, тип або пріоритет квитка {ticket} змінено.
    new_value: 'Нове значення: {value}'
    cta: Відкрити в {app}
  assignment:
    subject: Призначення квитка
    body: Вам призначено квиток {ticket}. Відкрийте його в {app}, щоб переглянути деталі.
    cta: Відкрити в {app}
  common:
    greeting: Привіт {name},
    link_hint: 'Якщо кнопка не працює, скопіюйте та вставте це посилання у свій браузер:'
    unsubscribe: Натисніть тут, якщо ви більше не хочете отримувати ці сповіщення
    unwatch: Натисніть тут, якщо ви більше не хочете дивитися цей квиток

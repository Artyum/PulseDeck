<!DOCTYPE html>
<html lang="{{ ui_lang }}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{% block title %}{{ app_name }}{% endblock title %}</title>
    </head>
    <body style="margin:0;
                 padding:0;
                 background:#f1f5f9;
                 font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                 color:#0f172a;
                 -webkit-text-size-adjust:100%">
        <table role="presentation"
               width="100%"
               cellspacing="0"
               cellpadding="0"
               style="background:#f1f5f9;
                      padding:24px 12px">
            <tr>
                <td align="center">
                    <table role="presentation"
                           width="600"
                           cellspacing="0"
                           cellpadding="0"
                           style="max-width:600px;
                                  width:100%;
                                  background:#ffffff;
                                  border:1px solid #e2e8f0;
                                  border-radius:8px;
                                  overflow:hidden">
                        <tr>
                            <td style="background:#2f72e8;padding:20px 28px;">
                                <span style="display:inline-block;
                                             font-size:20px;
                                             font-weight:700;
                                             color:#ffffff;
                                             letter-spacing:0.02em">{{ app_name }}</span>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding:28px;font-size:15px;line-height:1.55;color:#0f172a;">
                                {% block body %}
                                {% endblock body %}
                            </td>
                        </tr>
                        <tr>
                            <td style="padding:16px 28px 24px;
                                       border-top:1px solid #e2e8f0;
                                       font-size:12px;
                                       line-height:1.45;
                                       color:#64748b">{{ t('email.common.footer', app=app_name) }}</td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>

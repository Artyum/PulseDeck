<!DOCTYPE html>
<html lang="{{ ui_lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ app_name }}{% endblock title %}</title>
  </head>
  <body style="margin:0;
               padding:0;
               background:#e8eef5;
               font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
               color:#0f172a;
               -webkit-text-size-adjust:100%">
    <table role="presentation"
           width="100%"
           cellspacing="0"
           cellpadding="0"
           style="background:#e8eef5;
                  padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation"
                 width="720"
                 cellspacing="0"
                 cellpadding="0"
                 style="max-width:720px;
                        width:100%;
                        background:#ffffff;
                        border:1px solid #d7e0ea;
                        border-radius:12px;
                        overflow:hidden">
            <tr>
              <td style="background:#1e3a5f;padding:20px 36px;">
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="vertical-align:middle;padding-right:12px;">
                      <img src="{{ logo_src }}"
                           alt="{{ app_name }}"
                           width="56"
                           height="35"
                           style="display:block;
                                  width:56px;
                                  height:35px;
                                  border:0;
                                  outline:none;
                                  text-decoration:none" />
                    </td>
                    <td style="vertical-align:middle;">
                      <span style="display:inline-block;
                                   font-size:24px;
                                   font-weight:700;
                                   color:#ffffff;
                                   letter-spacing:-0.02em;
                                   line-height:1">{{ app_name }}</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:36px;font-size:15px;line-height:1.6;color:#0f172a;">
                {% block body %}
                {% endblock body %}
              </td>
            </tr>
            {% if unsubscribe_url %}
              <tr>
                <td style="padding:16px 36px 20px;
                           background:#f4f7fb;
                           border-top:1px solid #e2e8f0;
                           text-align:center">
                  <a href="{{ unsubscribe_url }}"
                     style="font-size:13px;
                            line-height:1.45;
                            color:#64748b;
                            text-decoration:underline">{{ t("email.common.unsubscribe") }}</a>
                </td>
              </tr>
            {% endif %}
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

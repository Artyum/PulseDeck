{% extends "_base.html" %}
{% block title %}{{ t("email.mfa.subject") }}{% endblock title %}
{% block body %}
  <p style="margin:0 0 12px;">{{ t('email.common.greeting', name=user.first_name) }}</p>
  <p style="margin:0 0 12px;">{{ t('email.mfa.body') }}</p>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:4px 0 24px;">
    <tr>
      <td align="center">
        <div style="display:inline-block;padding:18px 32px;background-color:#e8eef5;border:1px solid #d7e0ea;border-radius:8px;">
          <span style="font-family:Consolas,Monaco,'Courier New',monospace;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:0.14em;color:#1e3a5f;-webkit-user-select:all;user-select:all;">{{ code }}</span>
        </div>
      </td>
    </tr>
  </table>
  <p style="margin:0;">{{ t('email.mfa.ttl', minutes=minutes) }}</p>
{% endblock body %}

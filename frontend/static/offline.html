<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2f72e8">
    <title>PulseDeck — offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0a0a0a;
        color: #f2f2f2;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        font-weight: 650;
      }
      p {
        margin: 0 0 0.35rem;
        line-height: 1.45;
        color: #b8b8b8;
        font-size: 0.95rem;
      }
      .en {
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.65rem 1.15rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #2f72e8;
        cursor: pointer;
      }
      button:hover {
        background: #3d7ff0;
      }
      button:focus-visible {
        outline: 2px solid #7eb0ff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/static/images/android-chrome-192x192.png" width="72" height="72" alt="PulseDeck">
      <h1>Brak połączenia</h1>
      <p>Nie udało się wczytać strony. Sprawdź sieć i spróbuj ponownie.</p>
      <p class="en">You’re offline. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Spróbuj ponownie / Retry</button>
    </main>
  </body>
</html>

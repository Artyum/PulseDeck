{% extends "base.html" %}
{% block title %}Ustaw hasło — {{ app_name }}{% endblock %}
{% block body %}
    <div class="auth-scene">
        <div class="w-full max-w-md">
            <div class="mb-8 text-center">
                <h1 class="auth-brand">{{ app_name }}</h1>
                <p class="mt-3 text-[1.1rem] text-steel">Ustaw nowe hasło</p>
            </div>
            <div class="auth-card">
                {% if error %}
                    <p class="alert alert-error mb-4">{{ error }}</p>
                {% endif %}
                <form method="post" action="/auth/set-password" class="space-y-4">
                    <input type="hidden" name="token" value="{{ token }}">
                    <div>
                        <label class="label" for="new_password">Nowe hasło</label>
                        <input id="new_password"
                               name="new_password"
                               type="password"
                               required
                               class="input mt-1.5"
                               autocomplete="new-password">
                    </div>
                    <div>
                        <label class="label" for="confirm_password">Powtórz hasło</label>
                        <input id="confirm_password"
                               name="confirm_password"
                               type="password"
                               required
                               class="input mt-1.5"
                               autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-full !py-3 !text-[1rem]">Zapisz hasło</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}

{% extends "base.html" %}
{% block title %}{{ t("ui.auth.confirm_email.title") }} — {{ app_name }}{% endblock title %}
{% block body %}
  <div class="auth-scene">
    <div class="w-full max-w-md">
      <div class="mb-8 text-center">
        <h1 class="auth-brand">{{ app_name }}</h1>
        <p class="mt-3 text-[1.1rem] text-steel">{{ t("ui.auth.confirm_email.subtitle") }}</p>
      </div>
      <div class="auth-card">
        {% if error %}
          <p class="alert alert-error mb-4">{{ error }}</p>
        {% endif %}
        <form method="post"
              action="{{ url_for('confirm_email_submit') }}"
              class="space-y-4">
          <input type="hidden" name="token" value="{{ token }}">
          <button type="submit" class="btn btn-primary w-full !py-3 !text-[1rem]">
            {{ t("ui.auth.confirm_email.submit") }}
          </button>
        </form>
      </div>
    </div>
  </div>
{% endblock body %}

{% extends "admin/base_settings.html" %}
{% block settings_content %}
  <section class="admin-section">
    <h2 class="issue-section-title">{{ t("ui.admin.settings.tickets.heading") }}</h2>
    <p class="admin-section-note">{{ t("ui.admin.settings.tickets.hint") }}</p>
    <form method="post"
          action="{{ url_for('admin_settings_tickets_save') }}"
          class="admin-form-stack admin-settings-form">
      <div class="form-grid form-grid-3">
        <div class="admin-field">
          <label class="label" for="ticket_reopen_days">{{ t("ui.admin.settings.tickets.reopen_days") }}</label>
          <input id="ticket_reopen_days"
                 name="ticket_reopen_days"
                 type="number"
                 min="0"
                 max="3650"
                 required
                 value="{{ form.ticket_reopen_days }}"
                 class="input">
        </div>
        <div class="admin-field">
          <label class="label" for="auth_link_ttl_days">{{ t("ui.admin.settings.tickets.auth_link_ttl_days") }}</label>
          <input id="auth_link_ttl_days"
                 name="auth_link_ttl_days"
                 type="number"
                 min="1"
                 max="365"
                 required
                 value="{{ form.auth_link_ttl_days }}"
                 class="input">
        </div>
        <div class="admin-field">
          <label class="label" for="email_confirm_ttl_minutes">{{ t("ui.admin.settings.tickets.email_confirm_ttl_minutes") }}</label>
          <input id="email_confirm_ttl_minutes"
                 name="email_confirm_ttl_minutes"
                 type="number"
                 min="5"
                 max="10080"
                 required
                 value="{{ form.email_confirm_ttl_minutes }}"
                 class="input">
        </div>
      </div>
      <div class="admin-form-actions">
        <button type="submit" class="btn btn-primary">{{ t("ui.admin.settings.save") }}</button>
      </div>
    </form>
  </section>
{% endblock settings_content %}

{% extends "admin/base_admin.html" %}
{% block title %}Projekty — {{ app_name }}{% endblock %}
{% block content %}
    <div class="flex items-center justify-between gap-4">
        <h1 class="page-title">Projekty</h1>
    </div>
    {% if error %}<p class="alert alert-error mt-4">{{ error }}</p>{% endif %}
    <form method="post"
          action="/admin/projects"
          class="panel panel-pad mt-6 flex flex-wrap gap-3">
        <input name="name"
               required
               placeholder="Nazwa projektu"
               value="{{ form_name or '' }}"
               class="input !w-auto min-w-[12rem]">
        <input name="key"
               required
               pattern="[A-Za-z0-9]{3,10}"
               maxlength="10"
               placeholder="Key (np. VOYA)"
               value="{{ form_key or '' }}"
               title="3–10 znaków A–Z / 0–9"
               class="input !w-auto min-w-[8rem] uppercase">
        <input name="description"
               placeholder="Opis (opcjonalnie)"
               value="{{ form_description or '' }}"
               class="input min-w-[240px] flex-1">
        <button type="submit" class="btn btn-primary">Utwórz</button>
    </form>
    <ul class="mt-6 space-y-2">
        {% for p in projects %}
            <li class="list-row">
                <a href="{{ p|admin_project_path }}"
                   class="font-semibold text-ink hover:text-pulse">{{ p.name }}
                    <span class="text-sm font-normal text-steel">{{ p.key }}</span></a>
                <form method="post"
                      action="{{ p|admin_project_path }}/delete"
                      onsubmit="return confirm('Usunąć projekt?')">
                    <button type="submit" class="btn-danger text-sm">Usuń</button>
                </form>
            </li>
        {% else %}
            <li class="text-steel">Brak projektów.</li>
        {% endfor %}
    </ul>
{% endblock %}

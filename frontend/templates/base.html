<!DOCTYPE html>
<html lang="{{ ui_lang }}"
      data-theme="{{ ui_theme }}"
      data-theme-gradient="{{ ui_theme_gradient }}"
      data-density="{{ ui_density }}"
      data-font-size="{{ ui_font_size }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
          var root = document.documentElement;
          function applyPref(key, allowed, attr) {
            try {
              var value = localStorage.getItem(key);
              if (value && allowed.indexOf(value) !== -1) {
                root.setAttribute(attr, value);
              }
            } catch (e) {}
          }
          applyPref(
            {{ theme_storage_key|tojson }},
            {{ theme_choices|map(attribute='id')|list|tojson }},
            "data-theme"
          );
          try {
            var gradKey = {{ theme_gradient_storage_key|tojson }};
            var theme = root.getAttribute("data-theme") || {{ ui_theme|tojson }};
            var map = JSON.parse(localStorage.getItem(gradKey) || "{}");
            var grad = map[theme];
            root.setAttribute(
              "data-theme-gradient",
              grad === false || grad === "off" ? "off" : "on"
            );
          } catch (e) {}
          applyPref(
            {{ density_storage_key|tojson }},
            {{ density_choices|map(attribute='id')|list|tojson }},
            "data-density"
          );
          applyPref(
            {{ font_size_storage_key|tojson }},
            {{ font_size_choices|map(attribute='id')|list|tojson }},
            "data-font-size"
          );
        })();
    </script>
    <title>{% block title %}{{ app_name }}{% endblock title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    <script>window.__i18n = {{ js_i18n|tojson }};</script>
    <script src="{{ url_for('static', path='vendor/htmx.min.js') }}"></script>
    <script src="{{ url_for('static', path='vendor/alpine.min.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
    <script src="{{ url_for('static', path='js/attach-picker.js') }}" defer></script>
    <meta name="csrf-token" content="{{ csrf_token }}">
  </head>
  <body class="min-h-screen antialiased"
        hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
    {% block body %}
    {% endblock body %}
    <dialog id="app-confirm"
            class="modal modal-confirm"
            aria-labelledby="app-confirm-title">
      <div class="modal-form">
        <div class="modal-header">
          <h2 class="modal-title" id="app-confirm-title">{{ t("ui.confirm.title") }}</h2>
          <button type="button"
                  class="modal-close"
                  data-confirm-cancel
                  aria-label="{{ t('ui.common.close') }}"
                  onclick="this.closest('dialog').close()">×</button>
        </div>
        <div class="modal-body">
          <p id="app-confirm-message" class="confirm-message"></p>
        </div>
        <div class="modal-footer">
          <button type="button"
                  class="btn btn-secondary"
                  data-confirm-cancel
                  onclick="this.closest('dialog').close()">{{ t("ui.common.cancel") }}</button>
          <button type="button" class="btn btn-primary" id="app-confirm-ok">{{ t("ui.common.confirm") }}</button>
        </div>
      </div>
    </dialog>
    {% if is_dev and dev_page_info %}
      <div class="dev-frame" role="status" aria-label="{{ t('ui.dev.aria') }}">
        <span class="dev-frame__badge">Dev</span>
        <span class="dev-frame__meta"
              title="{{ dev_page_info.method }} {{ dev_page_info.route_path }}">
          <span class="dev-frame__method">{{ dev_page_info.method }}</span>
          <span class="dev-frame__path">{{ dev_page_info.route_path }}</span>
        </span>
        <button type="button"
                id="dev-page-copy"
                class="dev-frame__copy"
                data-dev-page-info="{{ dev_page_info | tojson | forceescape }}"
                aria-label="{{ t('ui.dev.copy_aria') }}">{{ t("ui.dev.copy") }}</button>
      </div>
      <script src="{{ url_for('static', path='js/dev-page-copy.js') }}" defer></script>
    {% endif %}
  </body>
</html>

{% macro rich_editor(name, field_id, value='', placeholder='', id=none, extra_class='', quote_coachmark=false) -%}
  <div class="rich-editor {{ extra_class }}"
       data-rich-editor
       data-field-wrap
       {% if placeholder %}data-placeholder="{{ placeholder }}"{% endif %}
       {% if id %}id="{{ id }}"{% endif %}>
    <input type="hidden"
           name="{{ name }}"
           value="{{ value }}"
           {{ field_attrs(field_id, required=False) }}
           data-rich-input>
    <div class="rich-editor-toolbar"
         role="toolbar"
         aria-label="{{ t('ui.editor.toolbar') }}">
      <button type="button"
              class="rich-editor-btn"
              data-rich-cmd="toggleBold"
              aria-label="{{ t('ui.editor.bold') }}"
              title="{{ t('ui.editor.bold') }}"><strong>B</strong></button>
      <button type="button"
              class="rich-editor-btn"
              data-rich-cmd="toggleItalic"
              aria-label="{{ t('ui.editor.italic') }}"
              title="{{ t('ui.editor.italic') }}"><em>I</em></button>
      <button type="button"
              class="rich-editor-btn"
              data-rich-cmd="setLink"
              aria-label="{{ t('ui.editor.link') }}"
              title="{{ t('ui.editor.link') }}">Link</button>
      <span class="rich-editor-sep" aria-hidden="true"></span>
      <button type="button"
              class="rich-editor-btn"
              data-rich-cmd="toggleBulletList"
              aria-label="{{ t('ui.editor.bullet_list') }}"
              title="{{ t('ui.editor.bullet_list') }}">•≡</button>
      <button type="button"
              class="rich-editor-btn"
              data-rich-cmd="toggleOrderedList"
              aria-label="{{ t('ui.editor.ordered_list') }}"
              title="{{ t('ui.editor.ordered_list') }}">1.</button>
      <span class="rich-editor-sep" aria-hidden="true"></span>
      <button type="button"
              class="rich-editor-btn"
              data-rich-cmd="toggleCodeBlock"
              aria-label="{{ t('ui.editor.code_block') }}"
              title="{{ t('ui.editor.code_block') }}">{ }</button>
      <button type="button"
              class="rich-editor-btn"
              data-rich-cmd="toggleBlockquote"
              {% if quote_coachmark %}data-coachmark="compose-quote"{% endif %}
              aria-label="{{ t('ui.editor.blockquote') }}"
              title="{{ t('ui.editor.blockquote') }}">❝</button>
    </div>
    <div class="rich-editor-input-frame">
      <div class="rich-editor-surface textarea">
        <div data-rich-surface></div>
      </div>
      <div class="rich-editor-meter"
           data-rich-meter
           hidden>
        <div class="rich-editor-meter-track"
             role="progressbar"
             aria-valuemin="0"
             aria-valuenow="0"
             aria-valuemax="0">
          <div class="rich-editor-meter-fill" data-rich-meter-fill></div>
        </div>
        <span class="rich-editor-meter-label" data-rich-meter-label aria-hidden="true"></span>
      </div>
    </div>
    <div class="rich-editor-link-pop" data-rich-link-pop hidden>
      <input type="url"
             class="input"
             data-rich-link-input
             placeholder="https://"
             aria-label="{{ t('ui.editor.link') }}"
             autocomplete="url"
             inputmode="url">
      <div class="rich-editor-link-pop-actions">
        <button type="button" class="btn btn-secondary btn-sm" data-rich-link-cancel>{{ t("ui.common.cancel") }}</button>
        <button type="button" class="btn btn-primary btn-sm" data-rich-link-apply>{{ t("ui.editor.link_apply") }}</button>
      </div>
    </div>
  </div>
{%- endmacro %}
